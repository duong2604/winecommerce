services:
  postgres:
    image: postgres:16-alpine
    container_name: win_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: winecommerce
      POSTGRES_PASSWORD: winecommerce
      POSTGRES_DB: win_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U winecommerce -d winecommerce']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: win_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass winecommerce
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'winecommerce', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: win_redis_insight
    restart: unless-stopped
    ports:
      - '8001:5540'
    depends_on:
      - redis

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog_server
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP port
      - '8025:8025' # Web UI
volumes:
  postgres_data:
  redis_data:
